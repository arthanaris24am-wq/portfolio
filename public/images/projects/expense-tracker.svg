<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0d12"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181920"/>
      <stop offset="100%" stop-color="#111217"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff5a1f" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#ff7a45"/>
      <stop offset="100%" stop-color="#ffaa40"/>
    </linearGradient>
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff5a1f" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ff5a1f" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#bg)"/>
  
  <!-- Subtle Grid -->
  <pattern id="grid1" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  </pattern>
  <rect width="800" height="500" rx="16" fill="url(#grid1)"/>

  <!-- Top Window Bar -->
  <rect x="0" y="0" width="800" height="48" fill="#14151b" rx="16" />
  <rect x="0" y="32" width="800" height="16" fill="#14151b" />
  <circle cx="28" cy="24" r="5" fill="#ff5f56"/>
  <circle cx="46" cy="24" r="5" fill="#ffbd2e"/>
  <circle cx="64" cy="24" r="5" fill="#27c93f"/>
  <text x="400" y="28" fill="#71717a" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">ai-expense-tracker // neural analytics engine</text>

  <!-- KPI Cards -->
  <rect x="50" y="80" width="210" height="90" rx="10" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="70" y="110" fill="#a1a1aa" font-family="'Inter', sans-serif" font-size="12">TOTAL SPEND ANALYZED</text>
  <text x="70" y="145" fill="#ffffff" font-family="'Syne', sans-serif" font-weight="700" font-size="24">$18,420.50</text>
  <circle cx="230" cy="125" r="10" fill="rgba(255,90,31,0.15)"/>
  <circle cx="230" cy="125" r="4" fill="#ff5a1f"/>

  <rect x="295" y="80" width="210" height="90" rx="10" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="315" y="110" fill="#a1a1aa" font-family="'Inter', sans-serif" font-size="12">AUTO-CLASSIFIED</text>
  <text x="315" y="145" fill="#ffffff" font-family="'Syne', sans-serif" font-weight="700" font-size="24">99.4%</text>
  <text x="440" y="145" fill="#22c55e" font-family="'JetBrains Mono', monospace" font-size="12">+4.2%</text>

  <rect x="540" y="80" width="210" height="90" rx="10" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="560" y="110" fill="#a1a1aa" font-family="'Inter', sans-serif" font-size="12">ANOMALIES FLAGGED</text>
  <text x="560" y="145" fill="#ffffff" font-family="'Syne', sans-serif" font-weight="700" font-size="24">12 alerts</text>
  <circle cx="720" cy="125" r="10" fill="rgba(239,68,68,0.15)"/>
  <circle cx="720" cy="125" r="4" fill="#ef4444"/>

  <!-- Main Chart Canvas -->
  <rect x="50" y="195" width="700" height="260" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="75" y="230" fill="#ffffff" font-family="'Syne', sans-serif" font-size="14" font-weight="700">Predictive Cashflow & Category Breakdown</text>

  <!-- Horizontal guidelines -->
  <line x1="75" y1="260" x2="725" y2="260" stroke="rgba(255,255,255,0.05)" stroke-dasharray="4 4"/>
  <line x1="75" y1="310" x2="725" y2="310" stroke="rgba(255,255,255,0.05)" stroke-dasharray="4 4"/>
  <line x1="75" y1="360" x2="725" y2="360" stroke="rgba(255,255,255,0.05)" stroke-dasharray="4 4"/>
  <line x1="75" y1="410" x2="725" y2="410" stroke="rgba(255,255,255,0.08)"/>

  <!-- Chart Area Fill -->
  <path d="M 90 390 Q 180 340 270 360 T 450 280 T 630 250 L 710 240 L 710 410 L 90 410 Z" fill="url(#areaGrad)"/>

  <!-- Chart Line -->
  <path d="M 90 390 Q 180 340 270 360 T 450 280 T 630 250 L 710 240" fill="none" stroke="url(#lineGrad)" stroke-width="3" stroke-linecap="round"/>

  <!-- Data Points -->
  <circle cx="270" cy="360" r="4" fill="#ff5a1f"/>
  <circle cx="450" cy="280" r="4" fill="#ff7a45"/>
  <circle cx="630" cy="250" r="6" fill="#ff5a1f" stroke="#ffffff" stroke-width="2"/>

  <!-- Tooltip over active point -->
  <rect x="580" y="195" width="100" height="42" rx="6" fill="#1e1f29" stroke="rgba(255,90,31,0.4)" stroke-width="1"/>
  <text x="630" y="213" fill="#a1a1aa" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">SEPTEMBER</text>
  <text x="630" y="229" fill="#ff5a1f" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" text-anchor="middle">$4,850.20</text>
</svg>

