<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="100%" stop-color="#040608"/>
    </linearGradient>
    <radialGradient id="scanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff5a1f" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#ff5a1f" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#bg2)"/>

  <!-- Window Header -->
  <rect x="0" y="0" width="800" height="48" fill="#11161f" rx="16" />
  <rect x="0" y="32" width="800" height="16" fill="#11161f" />
  <circle cx="28" cy="24" r="5" fill="#ff5f56"/>
  <circle cx="46" cy="24" r="5" fill="#ffbd2e"/>
  <circle cx="64" cy="24" r="5" fill="#27c93f"/>
  <text x="400" y="28" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">vision-ai // deep polyp diagnostic segmenter</text>

  <!-- Left: Medical Scan Viewport -->
  <rect x="40" y="70" width="440" height="390" rx="12" fill="#080b0f" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  
  <!-- Diagnostic Crosshair & Grid -->
  <circle cx="260" cy="265" r="140" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="3 3"/>
  <circle cx="260" cy="265" r="90" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <circle cx="260" cy="265" r="45" fill="url(#scanGlow)"/>

  <!-- Polyp Bounding Box & Target Mask -->
  <rect x="210" y="215" width="105" height="105" rx="4" fill="rgba(255, 90, 31, 0.12)" stroke="#ff5a1f" stroke-width="1.8" stroke-dasharray="6 3"/>
  <path d="M 205 210 L 220 210 M 205 210 L 205 225" stroke="#ff7a45" stroke-width="3"/>
  <path d="M 320 210 L 305 210 M 320 210 L 320 225" stroke="#ff7a45" stroke-width="3"/>
  <path d="M 205 325 L 220 325 M 205 325 L 205 310" stroke="#ff7a45" stroke-width="3"/>
  <path d="M 320 325 L 305 325 M 320 325 L 320 310" stroke="#ff7a45" stroke-width="3"/>

  <!-- Mask detection polygon -->
  <path d="M 235 240 Q 275 230 290 255 Q 300 280 270 300 Q 240 305 230 280 Z" fill="rgba(255,90,31,0.3)" stroke="#ff5a1f" stroke-width="2"/>

  <!-- Detection Badge -->
  <rect x="210" y="185" width="140" height="24" rx="4" fill="#ff5a1f"/>
  <text x="280" y="201" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">POLYP CONF: 96.8%</text>

  <!-- Right: Metrics Panel -->
  <rect x="505" y="70" width="255" height="390" rx="12" fill="#0f131a" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  
  <text x="530" y="105" fill="#ffffff" font-family="'Syne', sans-serif" font-size="15" font-weight="700">INFERENCE TELEMETRY</text>

  <!-- Metric 1 -->
  <text x="530" y="145" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Model Architecture</text>
  <text x="530" y="168" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="13">U-Net + ResNet-50</text>
  <line x1="530" y1="185" x2="735" y2="185" stroke="rgba(255,255,255,0.06)"/>

  <!-- Metric 2 -->
  <text x="530" y="215" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">IoU Score (Validation)</text>
  <text x="530" y="238" fill="#22c55e" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700">0.894 (Dice: 0.93)</text>
  <line x1="530" y1="255" x2="735" y2="255" stroke="rgba(255,255,255,0.06)"/>

  <!-- Metric 3 -->
  <text x="530" y="285" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Latency / FPS</text>
  <text x="530" y="308" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="13">18.4ms ~ 54.3 FPS</text>
  <line x1="530" y1="325" x2="735" y2="325" stroke="rgba(255,255,255,0.06)"/>

  <!-- Status Bar -->
  <rect x="530" y="355" width="205" height="70" rx="8" fill="#161b24" stroke="rgba(255,90,31,0.2)" stroke-width="1"/>
  <circle cx="550" cy="390" r="4" fill="#22c55e"/>
  <text x="565" y="385" fill="#ffffff" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Real-time Stream OK</text>
  <text x="565" y="405" fill="#71717a" font-family="'JetBrains Mono', monospace" font-size="10">CUDA TensorRT active</text>
</svg>

